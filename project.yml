name: LingoPop
options:
  bundleIdPrefix: com.lingopop
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ARCHS: "arm64 x86_64"
    VALID_ARCHS: "arm64 x86_64"
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.0"

targets:
  LingoPop:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App
      - path: Core
      - path: Providers
      - path: UI
      - path: Models
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: LingoPop
        CFBundleDisplayName: LingoPop
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppleEventsUsageDescription: "LingoPop needs Accessibility access to capture selected text."
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/LingoPop.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingopop.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HotKey
