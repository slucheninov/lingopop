name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"

      # NOTE: brew cannot pin a formula version, so xcodegen floats to the latest release.
      - name: Install xcodegen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Check localizations
        run: python3 scripts/check-localizations.py

      - name: Build and test
        run: ./scripts/test.sh

  package:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Build universal package
        run: ./scripts/release.sh

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lingopop-main-${{ github.sha }}
          path: dist/*
          retention-days: 14
