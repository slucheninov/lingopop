name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0). Leave blank to read from project.yml.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14   # Apple Silicon — xcodebuild cross-compiles to x86_64 for universal

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install xcodegen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Could not resolve a version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Validate version format
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$VERSION" ]] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Build universal release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh "$VERSION"

      - name: Verify artifacts
        run: |
          ls -lh dist/

      - name: Upload workflow artifacts (debug)
        uses: actions/upload-artifact@v7
        with:
          name: lingopop-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 7

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || echo "")
          {
            echo "## LingoPop v${VERSION}"
            echo ""
            if [[ -n "$PREV_TAG" ]]; then
              echo "### Changes since $PREV_TAG"
              git log --pretty=format:'- %s' "${PREV_TAG}..v${VERSION}" 2>/dev/null || true
            else
              echo "Initial release."
            fi
            echo ""
            echo ""
            echo "### Install"
            echo ""
            echo "1. Download \`LingoPop-${VERSION}-mac-universal.dmg\` (Universal, both Apple Silicon and Intel)."
            echo "2. Open the dmg and drag LingoPop to Applications."
            echo "3. First launch: right-click LingoPop.app → **Open** (the app is ad-hoc signed, Gatekeeper will warn once)."
            echo "4. Grant Accessibility access when prompted (Settings → Privacy & Security → Accessibility)."
            echo ""
            echo "Need Intel- or arm64-only builds? They are attached separately."
          } > release_notes.md
          cat release_notes.md

      - name: Generate SHA256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip 2>/dev/null | tee SHA256SUMS

      - name: Publish release in public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$PUBLIC_REPO" ]]; then
            echo "::error::Repository variable PUBLIC_REPO is not set (e.g. owner/repo)."
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Secret PUBLIC_REPO_TOKEN is not set."
            exit 1
          fi

          gh release create "v${VERSION}" \
            --repo "$PUBLIC_REPO" \
            --title "LingoPop v${VERSION}" \
            --notes-file release_notes.md \
            "dist/LingoPop-${VERSION}-mac-universal.dmg" \
            "dist/LingoPop-${VERSION}-mac-universal.zip" \
            "dist/SHA256SUMS"
